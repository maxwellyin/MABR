[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mabr"
version = "0.1.0"
description = "Modernized research codebase for MABR bias mitigation experiments."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.17.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.3",
  "tqdm>=4.66",
  "transformers>=4.38.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
tracking = [
  "wandb>=0.17",
]

[project.scripts]
mabr = "mabr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
